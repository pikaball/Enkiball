<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enkiball Teacher</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <h2>ENKI-TEACHER</h2>
      <span class="subtitle">严格技术导师</span>
    </div>
    <div id="project-selector">
      <span class="label">课题</span>
      <select id="project-select"></select>
      <button id="new-project-btn" title="新建课题">+</button>
    </div>
    <div id="topic-display">
      <span class="label">当前主题</span>
      <span id="topic-name">未设定</span>
    </div>
    <div id="level-display">
      <span class="label">掌握等级</span>
      <span id="level-name">L1 — 精准记忆</span>
    </div>
    <div id="curriculum-tree">
      <h3>课程模块</h3>
      <div id="modules-list">
        <p class="empty">尚未设置课程<br>输入 /learn &lt;主题&gt; 开始</p>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><span class="stat-label">评估次数</span><span id="stat-assessments" class="stat-value">0</span></div>
      <div class="stat"><span class="stat-label">认输次数</span><span id="stat-yields" class="stat-value">0</span></div>
    </div>
    <div id="commands-help">
      <h4>命令</h4>
      <ul>
        <li><code>/learn</code> 设定学习目标</li>
        <li><code>/progress</code> 查看进度</li>
        <li><code>/assess</code> 请求评估</li>
        <li><code>/yield</code> 认输求解答</li>
        <li><code>/code</code> 代码评审模式</li>
        <li><code>/reset</code> 重置对话</li>
      </ul>
    </div>
  </aside>

  <main id="chat-container">
    <div id="messages">
      <div class="message system-msg">
        <div class="msg-content">
          <p><strong>ENKI-TEACHER</strong> 已就绪。</p>
          <p>我是一名严厉的技术导师。我不会容忍含糊、肤浅或错误的回答。</p>
          <p>输入 <code>/learn &lt;主题&gt;</code> 设定你的学习目标。</p>
        </div>
      </div>
    </div>
    <div id="input-area">
      <textarea id="input" rows="1"
             placeholder="输入消息或命令... (Enter 发送, Shift+Enter 换行)"
             autofocus></textarea>
      <button id="send-btn" title="发送 (Enter)">&#9654;</button>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
